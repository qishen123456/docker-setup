# =========================
# SmartAsk Nginx 生产环境配置
# 用途：单公网端口反向代理（后端 API + 前端静态资源）
#
# 使用方式：
#   1. 修改 .env.production 中的 PUBLIC_DOMAIN
#   2. cp .env.production .env
#   3. 注释掉 docker-compose.yml 中 backend/frontend 的 ports
#   4. docker-compose --profile production up -d
# =========================

server {
    listen ${NGINX_PORT:-80};
    server_name ${PUBLIC_DOMAIN:-localhost};

    # ====== 访问日志 ======
    access_log /var/log/nginx/smartask_access.log;
    error_log /var/log/nginx/smartask_error.log;

    # ====== 后端 API 路由 ======
    location /api/ {
        proxy_pass http://smartask-backend:5002;

        # SSE 支持（智能问数流式响应）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        # WebSocket 支持（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 传递真实客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 文件上传大小限制（如果需要大文件上传）
        client_max_body_size 100M;
    }

    # ====== 前端 SPA 路由支持 ======
    location / {
        proxy_pass http://smartask-frontend:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Vue Router history 模式支持
        # 所有前端路由都返回 index.html，由 Vue Router 处理
        try_files $uri $uri/ /index.html;
    }

    # ====== 静态资源缓存优化（可选）=====
    # location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    #     proxy_pass http://smartask-frontend:80;
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    # }

    # ====== 安全头（可选）=====
    # add_header X-Frame-Options "SAMEORIGIN" always;
    # add_header X-Content-Type-Options "nosniff" always;
    # add_header X-XSS-Protection "1; mode=block" always;

    # ====== 错误页面 ======
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

