services:
  postgres:
    image: postgres:16-alpine
    container_name: smartask-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SMARTASK_DB_DATABASE:-postgres}
      POSTGRES_USER: ${SMARTASK_DB_USERNAME:-postgres}
      # Postgres entrypoint cannot decrypt enc:v1 secrets. Keep this value
      # plain and aligned with the decrypted SMARTASK_DB_PASSWORD.
      POSTGRES_PASSWORD: ${SMARTASK_POSTGRES_PASSWORD:-${SMARTASK_DB_PASSWORD:-postgres}}
      TZ: Asia/Shanghai
    ports:
      - "${SMARTASK_DOCKER_PG_PORT:-5433}:5432"
    volumes:
      - smartask_pg_data:/var/lib/postgresql/data
      # Directory mount: every *.sql in docker/postgres/init runs in alphabetical order
      # ONLY the first time the data volume is empty (i.e. fresh DB).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SMARTASK_DB_USERNAME:-postgres} -d ${SMARTASK_DB_DATABASE:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # Use ${VAR-default} instead of ${VAR:-default} so users can set
        # SMARTASK_APT_MIRROR= to keep the official Debian image sources.
        APT_MIRROR: ${SMARTASK_APT_MIRROR-https://mirrors.aliyun.com}
        PIP_INDEX_URL: ${SMARTASK_PIP_INDEX_URL-https://mirrors.aliyun.com/pypi/simple/}
        PIP_TRUSTED_HOST: ${SMARTASK_PIP_TRUSTED_HOST-mirrors.aliyun.com}
        PIP_TIMEOUT: ${SMARTASK_PIP_TIMEOUT-120}
        PIP_RETRIES: ${SMARTASK_PIP_RETRIES-8}
    container_name: smartask-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SMARTASK_BACKEND_PORT: 5002
      SMARTASK_BOOTSTRAP_SKIP_BUILTINS: ${SMARTASK_BOOTSTRAP_SKIP_BUILTINS:-1}
      SMARTASK_BOOTSTRAP_SKIP_FIRST_IMPORT: ${SMARTASK_BOOTSTRAP_SKIP_FIRST_IMPORT:-1}
      SMARTASK_DB_HOST: postgres
      SMARTASK_DB_PORT: 5432
      SMARTASK_CHROMA_PATH: /app/chroma_db
      SMARTASK_CONFIG_DIR: /app/config
      SMARTASK_RUNTIME_BACKUP_DIR: /app/backups/runtime
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SMARTASK_BACKEND_PORT:-5002}:5002"
    volumes:
      - smartask_chroma:/app/chroma_db
      - ./logs:/app/logs
      - ./backend/logs:/app/backend/logs
      # Runtime JSON configs live here, including smartask_report_history.json.
      # Keep this bind mount when rebuilding so generated report history survives updates.
      - ./config:/app/config
      - ./backend/imports:/app/backend/imports
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5002/api/health', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${SMARTASK_NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: smartask-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${SMARTASK_FRONTEND_PORT:-8888}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  smartask_pg_data:
    name: smartask_pg_data
  smartask_chroma:
    name: smartask_chroma
