server {
    # 2026-08-21：TLS 由前置网关 10.2.33.23 (bifine.angelgroup.com.cn) 终结，
    # 网关向本机转发明文 HTTP，故本端口不启用 ssl。
    # 若将来直连本机需要 TLS，恢复 "listen 10899 ssl;" 并解开下方证书两行。
    listen 10899;
    http2 on;
    server_name bifine.angelgroup.com.cn;
    client_max_body_size 100m;

    # ssl_certificate     /www/server/nginx/conf/ssl/smartask.crt;
    # ssl_certificate_key /www/server/nginx/conf/ssl/smartask.key;

    # API 路由：转发后端
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_headers on;        # 确保所有客户端头（X-Auth-Token）转发
        proxy_request_buffering off;          # 流式转发，不缓冲大 body
        proxy_read_timeout 600s;              # 大 body 处理慢防 504
        proxy_buffering off;
        proxy_cache off;
        proxy_redirect off;
    }

    # 前端 SPA：根路径转发前端容器
    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
