<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartAsk 基础问数流程手绘图</title>
  <style>
    :root {
      --ink: #171717;
      --muted: #475569;
      --paper: #fffdf7;
      --blue: #2563eb;
      --purple: #7c3aed;
      --green: #16a34a;
      --red: #dc2626;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #e8eef7;
      color: var(--ink);
      font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    }

    .canvas {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 1px 1px, rgba(15, 23, 42, 0.13) 1px, transparent 1.25px) 0 0 / 18px 18px,
        linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px) 0 0 / 360px 100%,
        linear-gradient(0deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px) 0 0 / 100% 225px,
        var(--paper);
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hand {
      font-family: "Segoe Print", "Comic Sans MS", "Microsoft YaHei", cursive;
      font-weight: 800;
    }

    .title {
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .subtitle {
      font-size: 18px;
      fill: var(--muted);
    }

    .zone {
      fill: rgba(255, 255, 255, 0.62);
      stroke: #cbd5e1;
      stroke-width: 3;
      stroke-dasharray: 8 12;
    }

    .box {
      fill: rgba(255, 255, 255, 0.94);
      stroke: var(--ink);
      stroke-width: 4;
      stroke-linejoin: round;
      filter: url(#softShadow);
    }

    .miniBox {
      fill: rgba(255, 255, 255, 0.96);
      stroke: var(--ink);
      stroke-width: 3.5;
      stroke-linejoin: round;
      filter: url(#softShadow);
    }

    .pill {
      fill: url(#purpleInk);
      stroke: var(--ink);
      stroke-width: 3;
    }

    .pillText {
      fill: white;
      font-size: 22px;
      font-weight: 900;
    }

    .nodeTitle {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .nodeText {
      font-size: 16px;
      fill: #334155;
    }

    .small {
      font-size: 14px;
      fill: #475569;
    }

    .tag {
      font-size: 14px;
      font-weight: 800;
    }

    .agentCard {
      fill: rgba(238, 242, 255, 0.96);
      stroke: #4f46e5;
      stroke-width: 3;
      filter: url(#softShadow);
    }

    .agentName {
      font-size: 17px;
      font-weight: 900;
      fill: #312e81;
    }

    .arrow {
      fill: none;
      stroke: var(--ink);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      marker-end: url(#arrowHead);
    }

    .dash { stroke-dasharray: 10 11; }

    .softArrow {
      fill: none;
      stroke: #65a30d;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 10 10;
      marker-end: url(#greenArrowHead);
    }
  </style>
</head>
<body>
  <main class="canvas" role="img" aria-label="SmartAsk 基础问数流程手绘风网页流程图">
    <svg viewBox="0 0 1800 920" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="3" dy="5" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.14" />
        </filter>

        <pattern id="hatchPurple" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
          <rect width="9" height="9" fill="#f5e8ff" />
          <line x1="0" y1="0" x2="0" y2="9" stroke="#c084fc" stroke-width="2" opacity="0.45" />
        </pattern>

        <pattern id="hatchGreen" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
          <rect width="9" height="9" fill="#ecfdf5" />
          <line x1="0" y1="0" x2="0" y2="9" stroke="#86efac" stroke-width="2" opacity="0.52" />
        </pattern>

        <pattern id="hatchRed" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
          <rect width="9" height="9" fill="#fff1f2" />
          <line x1="0" y1="0" x2="0" y2="9" stroke="#fca5a5" stroke-width="2" opacity="0.55" />
        </pattern>

        <linearGradient id="purpleInk" x1="0" x2="1">
          <stop offset="0" stop-color="#7c3aed" />
          <stop offset="1" stop-color="#2563eb" />
        </linearGradient>

        <linearGradient id="mintInk" x1="0" x2="1">
          <stop offset="0" stop-color="#cffafe" />
          <stop offset="1" stop-color="#dcfce7" />
        </linearGradient>

        <marker id="arrowHead" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
          <path d="M1,1 L11,6 L1,11 Z" fill="#171717" />
        </marker>

        <marker id="greenArrowHead" markerWidth="13" markerHeight="13" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
          <path d="M1,1 L11,6 L1,11 Z" fill="#65a30d" />
        </marker>
      </defs>

      <!-- 标题 -->
      <path d="M42 54 C180 28, 345 45, 480 33 C610 22, 742 50, 860 40" fill="none" stroke="#a7f3d0" stroke-width="25" stroke-linecap="round" opacity="0.46" />
      <text x="64" y="70" class="title">SmartAsk 基础问数流程</text>
      <text x="68" y="108" class="subtitle">从用户问题到数据报告：先识别口径，再控权限，再生成 SQL，最后形成可解释结果</text>

      <!-- 用户提问 -->
      <circle cx="84" cy="212" r="23" fill="#e9d5ff" stroke="#9333ea" stroke-width="3" />
      <path d="M42 292 C51 247, 117 247, 130 292" fill="none" stroke="#9333ea" stroke-width="4" stroke-linecap="round" />
      <path d="M150 160 C184 128, 318 133, 332 170 C340 201, 304 227, 236 222 L174 268 L188 223 C142 216, 120 191, 150 160Z" fill="url(#hatchPurple)" stroke="#171717" stroke-width="3" />
      <text x="170" y="193" class="hand" font-size="26">用户提问</text>
      <path class="arrow dash" d="M133 252 L188 324" />

      <!-- 结果产物预览 -->
      <rect x="1430" y="56" width="330" height="190" rx="28" fill="#fff7fb" stroke="#a855f7" stroke-width="5" />
      <rect x="1462" y="91" width="70" height="52" rx="8" fill="#fef3c7" stroke="#171717" stroke-width="3" />
      <text x="1475" y="124" class="small">&gt; SQL</text>
      <path d="M1566 144 L1566 92 M1591 144 L1591 119 M1616 144 L1616 78 M1641 144 L1641 110" stroke="#16a34a" stroke-width="8" stroke-linecap="round" />
      <text x="1464" y="178" class="nodeText">查询语句</text>
      <text x="1561" y="178" class="nodeText">图表</text>
      <rect x="1464" y="198" width="82" height="36" fill="white" stroke="#171717" stroke-width="3" />
      <path d="M1464 210 H1546 M1464 222 H1546 M1491 198 V234 M1518 198 V234" stroke="#171717" stroke-width="2" />
      <text x="1561" y="224" class="nodeText">数据表</text>
      <path d="M1660 88 C1708 68, 1750 80, 1756 112 C1761 146, 1716 158, 1677 144 L1646 170 L1656 140 C1628 127, 1630 99, 1660 88Z" fill="#f5d0fe" stroke="#171717" stroke-width="3" />
      <text x="1668" y="120" class="small">继续追问</text>
      <text x="1676" y="140" class="small">Follow-up</text>

      <!-- 主区域 -->
      <rect x="168" y="282" width="1510" height="430" rx="24" class="zone" />
      <text x="196" y="314" class="small">基础流程运行区 · Basic Pipeline</text>

      <!-- 入口链路 -->
      <rect x="205" y="350" width="205" height="120" rx="24" class="box" />
      <path d="M232 399 C250 375, 284 387, 281 414 C278 437, 249 446, 232 427Z" fill="#fef08a" stroke="#171717" stroke-width="4" />
      <line x1="275" y1="435" x2="300" y2="461" stroke="#171717" stroke-width="7" stroke-linecap="round" />
      <rect x="300" y="390" width="82" height="42" rx="12" class="pill" />
      <text x="325" y="419" class="pillText">UI</text>
      <text x="225" y="510" class="nodeTitle">前端入口</text>
      <text x="225" y="538" class="nodeText">输入 / 会话 / 手选</text>

      <path class="arrow dash" d="M410 410 L474 410" />

      <rect x="474" y="350" width="195" height="120" rx="24" class="box" />
      <rect x="532" y="390" width="82" height="42" rx="12" class="pill" />
      <text x="545" y="419" class="pillText">API</text>
      <text x="500" y="510" class="nodeTitle">请求接入</text>
      <text x="500" y="538" class="nodeText">普通 / 流式返回</text>

      <path class="arrow dash" d="M669 410 L733 410" />

      <rect x="733" y="350" width="218" height="120" rx="24" class="box" />
      <rect x="769" y="390" width="146" height="46" fill="url(#mintInk)" stroke="#171717" stroke-width="3" />
      <text x="797" y="421" class="nodeTitle">流程分流</text>
      <text x="758" y="510" class="nodeText">基础 or 进阶回退</text>
      <text x="758" y="538" class="small">AskFlowController</text>

      <path class="arrow dash" d="M951 410 L1018 410" />

      <rect x="1018" y="330" width="350" height="160" rx="26" class="box" />
      <path d="M1050 363 C1130 345, 1218 360, 1290 352 C1324 348, 1348 355, 1358 367" fill="none" stroke="#bfdbfe" stroke-width="22" stroke-linecap="round" opacity="0.55" />
      <text x="1060" y="395" class="nodeTitle">基础问数服务</text>
      <text x="1060" y="427" class="nodeText">记忆多轮，补全追问口径</text>
      <text x="1060" y="455" class="nodeText">合并手选、确认、历史数据集</text>
      <rect x="1240" y="382" width="92" height="42" rx="13" fill="#dcfce7" stroke="#16a34a" stroke-width="3" />
      <text x="1260" y="410" class="tag" fill="#14532d">多轮</text>

      <path class="arrow dash" d="M1368 410 L1435 410" />

      <rect x="1435" y="330" width="190" height="160" rx="26" class="box" />
      <text x="1474" y="386" class="nodeTitle">返回结果</text>
      <text x="1474" y="420" class="nodeText">报告卡片</text>
      <text x="1474" y="448" class="nodeText">图表 / 表格</text>

      <!-- Agent 协作链路 -->
      <rect x="222" y="586" width="255" height="106" rx="22" class="miniBox" />
      <rect x="246" y="604" width="88" height="38" rx="12" class="agentCard" />
      <text x="260" y="629" class="agentName">Agent1</text>
      <text x="352" y="626" class="nodeTitle">锁定口径</text>
      <text x="248" y="662" class="nodeText">组织树 / 字段 / 相似问题</text>
      <text x="248" y="686" class="nodeText">多数据集命中时先确认</text>

      <path class="arrow dash" d="M477 640 L555 640" />

      <rect x="555" y="586" width="245" height="106" rx="22" class="miniBox" />
      <text x="590" y="626" class="nodeTitle">权限校验</text>
      <text x="590" y="662" class="nodeText">数据集权限 / 组织权限</text>
      <text x="590" y="686" class="nodeText">准备行级过滤条件</text>
      <path d="M742 606 L770 654 L716 654Z" fill="url(#hatchRed)" stroke="#dc2626" stroke-width="3" />

      <path class="arrow dash" d="M800 640 L878 640" />

      <rect x="878" y="586" width="255" height="106" rx="22" class="miniBox" />
      <rect x="902" y="604" width="88" height="38" rx="12" class="agentCard" />
      <text x="916" y="629" class="agentName">Agent2</text>
      <text x="1008" y="626" class="nodeTitle">生成 SQL</text>
      <text x="904" y="662" class="nodeText">Golden / Rule / 动态生成</text>
      <text x="904" y="686" class="nodeText">失败时根据错误修复</text>

      <path class="arrow dash" d="M1133 640 L1211 640" />

      <rect x="1211" y="586" width="235" height="106" rx="22" class="miniBox" />
      <rect x="1235" y="604" width="88" height="38" rx="12" class="agentCard" />
      <text x="1249" y="629" class="agentName">Agent3</text>
      <text x="1330" y="626" class="nodeTitle">复核执行</text>
      <text x="1238" y="662" class="nodeText">字段 / 口径 / 只读安全</text>
      <text x="1238" y="686" class="nodeText">套行级过滤后执行</text>

      <path class="arrow dash" d="M1446 640 L1525 640" />

      <rect x="1525" y="586" width="215" height="106" rx="22" fill="url(#hatchGreen)" stroke="#171717" stroke-width="4" filter="url(#softShadow)" />
      <rect x="1546" y="604" width="88" height="38" rx="12" class="agentCard" />
      <text x="1560" y="629" class="agentName">Agent4</text>
      <text x="1648" y="626" class="nodeTitle">业务解读</text>
      <text x="1548" y="662" class="nodeText">核心结论 / KPI / 结构树</text>
      <text x="1548" y="686" class="nodeText">合并为统一响应</text>

      <!-- SQL 与校验闭环 -->
      <path d="M1174 714 L1218 714 L1244 740 L1244 810 L1174 810Z" fill="#fff7ed" stroke="#171717" stroke-width="3" />
      <path d="M1218 714 L1218 740 L1244 740" fill="none" stroke="#171717" stroke-width="3" />
      <text x="1188" y="782" class="hand" font-size="30">SQL</text>

      <path class="arrow dash" d="M1630 692 C1600 770, 1460 808, 1348 806" />
      <rect x="1040" y="762" width="312" height="100" rx="28" fill="rgba(255,255,255,0.94)" stroke="#171717" stroke-width="4" filter="url(#softShadow)" />
      <text x="1080" y="804" class="nodeTitle">结果是否正确？</text>
      <path d="M1088 826 C1118 802, 1190 806, 1202 832 C1213 858, 1185 877, 1138 872 L1105 890 L1112 867 C1084 862, 1066 846, 1088 826Z" fill="url(#hatchGreen)" stroke="#171717" stroke-width="3" />
      <text x="1127" y="857" class="hand" font-size="22">正确</text>
      <path d="M1224 826 C1254 802, 1324 806, 1336 832 C1347 858, 1319 877, 1272 872 L1238 890 L1246 867 C1217 862, 1203 846, 1224 826Z" fill="url(#hatchRed)" stroke="#171717" stroke-width="3" />
      <text x="1262" y="857" class="hand" font-size="22">修正</text>

      <path class="softArrow" d="M1234 862 C980 902, 592 858, 358 694" />
      <text x="586" y="866" class="small">确认口径后回写样例，下一轮优先复用</text>

      <!-- 分区标签 -->
      <text x="206" y="570" class="hand" font-size="25">入口链路</text>
      <text x="224" y="742" class="hand" font-size="25">多轮 Agent 协作</text>
      <text x="1042" y="742" class="hand" font-size="25">SQL 引擎</text>
      <text x="1436" y="522" class="hand" font-size="25">报告输出</text>
    </svg>
  </main>
</body>
</html>
